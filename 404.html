<!doctype html>

<title>Not found — Sea of Grass</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />

<script>
  // GitHub Pages paths are case-sensitive; people type them however they like.
  // If a lowercase version of this address exists, go there instead.
  (function () {
    var KNOWN = ["/talaria/"];
    var path = location.pathname.toLowerCase();
    if (path.charAt(path.length - 1) !== "/") path += "/";
    for (var i = 0; i < KNOWN.length; i++) {
      if (path === KNOWN[i] || path === KNOWN[i] + "index.html/") {
        location.replace(KNOWN[i] + location.search + location.hash);
        return;
      }
    }
    var studies = path.match(/^\/studies\/[a-z0-9-]+\/$/);
    if (studies && location.pathname !== studies[0]) location.replace(studies[0]);
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
