const arcPts = (cx, cy, rx, ry, a0, a1, n = 40) => Array.from({length: n + 1}, (_, i) => { const a = a0 + (a1 - a0)*i/n; return [cx + rx*Math.cos(a), cy + ry*Math.sin(a)]; });
const FW = 0.52, FH = 0.40, FY = -1.065;
const stadium = (hw, hh, cy) => [...arcPts(hw - hh, cy, hh, hh, -Math.PI/2, Math.PI/2, 24), ...arcPts(-hw + hh, cy, hh, hh, Math.PI/2, Math.PI*1.5, 24)];
const TAB_EXT = 0.35;   // back end lengthened so the head-shaped finger hole is finger-sized (11-14)
const TAB = LIDV.tab.map(([x, y]) => [x, y < -0.55 ? y - TAB_EXT : y]);
const HEAD = [[-0.372, -0.3177], [-0.372, 0.3453], [-0.3678, 0.3759], [-0.3524, 0.4086], [-0.3165, 0.4416], [-0.2689, 0.4559], [0.261, 0.4562], [0.295, 0.4508], [0.3365, 0.4267], [0.3605, 0.3951], [0.3709, 0.3604], [0.372, -0.3176], [0.3695, -0.3259], [0.36, -0.3323], [0.3476, -0.3294], [0.1978, -0.1856], [0.1867, -0.1825], [0.1756, -0.1861], [0.1684, -0.1952], [0.1672, -0.2048], [0.1721, -0.2158], [0.3818, -0.4603], [0.396, -0.4659], [0.4099, -0.4599], [0.4157, -0.4455], [0.4153, 0.3561], [0.4058, 0.3997], [0.3839, 0.4398], [0.3629, 0.4624], [0.3284, 0.4848], [0.3029, 0.4945], [0.2719, 0.4996], [-0.2696, 0.4997], [-0.3155, 0.49], [-0.3555, 0.4683], [-0.3817, 0.4425], [-0.3995, 0.4151], [-0.4094, 0.3895], [-0.4154, 0.3542], [-0.4157, -0.4455], [-0.4099, -0.4599], [-0.394, -0.4658], [-0.3803, -0.4586], [-0.1721, -0.2158], [-0.1671, -0.2029], [-0.1692, -0.1934], [-0.1756, -0.1861], [-0.1867, -0.1825], [-0.1961, -0.1847], [-0.3477, -0.3295], [-0.3557, -0.3326], [-0.3642, -0.3309], [-0.3695, -0.326]];   // Mau head silhouette (ears + jaw), unit height
const HK = 0.78, HY = -1.065;            // finger hole: the head, 0.78 cm tall, ears toward the ring end
const HEADHOLE = HEAD.map(([x, y]) => [x*HK, HY + y*HK]);
// winding made consistent (outer one way, both holes the other): with mixed windings three.js filled the head hole in
const cw = (pts) => THREE.ShapeUtils.isClockWise(P2(pts));
const wind = (pts, wantCW) => cw(pts) === wantCW ? pts : pts.slice().reverse();
const tabShape = new THREE.Shape(P2(wind(TAB, true)));
tabShape.holes.push(new THREE.Path(P2(wind(stadium(FW, FH, FY), false))));
tabShape.holes.push(new THREE.Path(P2(wind(LIDV.crescent, false))));
const tabMat = new THREE.MeshPhysicalMaterial({color: 0x3e1458, metalness: .7, roughness: .3, clearcoat: .6, clearcoatRoughness: .2, envMapIntensity: .55});   // anodised Mau purple
const lift = (y) => 0;   // bend removed 11-14: it broke the tab's flat faces into uneven, lopsided shading      // ring end rises a touch off the lid, as real tabs do
const bend = (geo) => { const p = geo.attributes.position; for (let i = 0; i < p.count; i++) p.setZ(i, p.getZ(i) + lift(p.getY(i))); geo.computeVertexNormals(); return geo; };
const tabGeo = bend(new THREE.ExtrudeGeometry(tabShape, {depth: 0.03, bevelEnabled: false, curveSegments: 64}));   // no bevel: offsetting the head's sharp ears broke the cut; the hems round the edges
const TABY = PANEL + 0.035;
const tabG = new THREE.Group(); tabG.position.y = TABY; inner.add(tabG);
const tabM = new THREE.Mesh(tabGeo, tabMat); tabM.rotation.x = -Math.PI/2; tabM.castShadow = true; tabG.add(tabM);
// rolled hem: a round bead along the outline and round both holes, following the lift
const hem = (pts, rad) => { const v = pts.map(([x, y]) => new THREE.Vector3(x, lift(y) + 0.015, -y));
  const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(v, true), 256, rad, 10, true), tabMat); m.castShadow = true; tabG.add(m); };
hem(TAB, 0.034); hem(stadium(FW, FH, FY), 0.024); hem(LIDV.crescent, 0.02);
// rivet: a domed button on the tongue, with a pressed ring round it
const rivet = new THREE.Mesh(new THREE.SphereGeometry(0.16, 40, 14, 0, Math.PI*2, 0, Math.PI/2), endRing);
rivet.scale.set(1, 0.42, 1); rivet.position.set(0, TABY + 0.03, 0); inner.add(rivet);
const rring = new THREE.Mesh(new THREE.TorusGeometry(0.235, 0.022, 10, 64), tabMat); rring.rotation.x = Math.PI/2; rring.position.set(0, TABY + 0.03, 0); inner.add(rring);
// the web in the finger hole, with the Mau head cut through it (like the Budweiser crown)
fetch('mark.json?' + Date.now()).then(r => r.json()).then(polys => {
  const K = 0.60, P = (pts) => P2(pts.map(([x, y]) => [x*K, FY + y*K]));   // the simplified mark, now finger-hole sized
  const web = new THREE.Shape(P2(stadium(FW + 0.04, FH + 0.04, FY))); const shapes = [web];
  for (const p of polys) { web.holes.push(new THREE.Path(P(p.o)));
    for (const h of p.h) { const isl = new THREE.Shape(P(h)); shapes.push(isl); const box = new THREE.Box2().setFromPoints(P(h));
      for (const q of polys) if (q !== p && box.containsBox(new THREE.Box2().setFromPoints(P(q.o)))) isl.holes.push(new THREE.Path(P(q.o))); } }
  const wg = bend(new THREE.ExtrudeGeometry(shapes, {depth: 0.008, bevelEnabled: true, bevelThickness: .004, bevelSize: .003, bevelSegments: 2, curveSegments: 24}));
  const w = new THREE.Mesh(wg, tabMat); w.rotation.x = -Math.PI/2; w.position.y = -0.004; w.castShadow = true; tabG.add(w);
});

// the window (centre of the art, u = 0.5) toward the viewer
can.rotation.y = Math.PI;

addEventListener('resize', () => { cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });
window.__cam = cam; window.__ctl = ctl; window.__scene = scene; window.__tabShape = tabShape; window.__THREE = THREE; window.__r = r; window.__can = can;
(function loop(){ requestAnimationFrame(loop); ctl.update(); r.render(scene, cam); })();
</script></body></html>
