at the haunch, tapering to the hind tip (144°);</text><text x="1290" y="278" class="nb">the front tip (−36°) lands on the head’s edge.</text><text x="1290" y="316" class="nh">HEAD</text><text x="1290" y="342" class="nb">Circle r 2½m, internally tangent to O1 at −37°.</text><text x="1290" y="380" class="nh">EAR · THE SLOT</text><text x="1290" y="406" class="nb">Negative space: an arc ½m wide on r 7m (concentric),</text><text x="1290" y="428" class="nb">from −50° inside the head back to −124°,</text><text x="1290" y="450" class="nb">then out through the back so the ear tip is free.</text><text x="1290" y="488" class="nh">TAIL · EYE</text><text x="1290" y="514" class="nb">Tail r 1m, ½m off the arc at −170°. Eye r ⅓m.</text><text x="1290" y="552" class="nh">THE SYSTEM (1m = 8px on screen)</text><text x="1290" y="578" class="nb">Line ½m = 4px: rules, outlines, the window stroke.</text><text x="1290" y="600" class="nb">Corner 2½m = 20px (the head): buttons, cards, inputs.</text><text x="1290" y="622" class="nb">Dot ⅓m: bullets and status dots. Gap ½m everywhere.</text><text x="1290" y="644" class="nb">Ladder ⅓ · ½ · 1 · 2½ · 8.</text><text x="1290" y="692" class="nh">VARIANTS</text><g transform="translate(1290 708)"><rect width="170" height="150" rx="16" fill="#FFF6E9"/><svg x="10" y="10" width="150" height="130" viewBox="-4 8 104 84"><defs><mask id="v1b" maskUnits="userSpaceOnUse" x="-20" y="-20" width="160" height="160"><rect x="-20" y="-20" width="160" height="160" fill="#fff"/><circle cx="60.29" cy="74.16" r="40.0" fill="#000"/><path d="M72.50 33.19 A35.0 35.0 0 0 0 30.43 30.98 L24.14 26.90" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="75.46" cy="44.20" r="1.67" fill="#000"/></mask><mask id="v1h" maskUnits="userSpaceOnUse" x="-20" y="-20" width="160" height="160"><rect x="-20" y="-20" width="160" height="160" fill="#fff"/><path d="M72.50 33.19 A35.0 35.0 0 0 0 30.43 30.98 L24.14 26.90" fill="none" stroke="#00