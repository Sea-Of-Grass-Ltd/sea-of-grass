<!doctype html>
<html lang="en" data-theme="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkout (demo) · Sea of Grass</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0C11">
<link rel="icon" href="/preview/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/preview/assets/shop/page.css">
</head>
<body>
<div class="sp-wrap">
  <header class="sp-top">
    <a class="sp-home" href="/"><img src="/preview/assets/logo.svg" alt="" width="30" height="22"><span>Sea of Grass</span></a>
    <a class="sp-back" id="back" href="/preview/services/websites/#cart">&larr; Back to cart</a>
  </header>
  <div class="sp-demo" role="note"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.2v.3"/></svg>
    <p style="margin:0"><b>This is a demo shop.</b> Nothing is charged and no order is sent. To buy for real, <a href="https://cal.com/sea-of-grass" target="_blank" rel="noopener">book a free 20-minute call</a> or email <a href="mailto:hello@seaofgrass.studio">hello@seaofgrass.studio</a>.</p></div>
  <main id="co"></main>
</div>
<script src="/preview/assets/shop/checkout-links.js"></script>
<script>
(function(){
var S=window.SOG_SHOP,P=S.products,c={};
try{c=JSON.parse(localStorage.getItem('sog-cart')||'{}');}catch(e){}
var ids=Object.keys(c).filter(function(k){return P[k]&&c[k]>0;});
var money=function(n){return '$'+n.toLocaleString('en-US');};
/* Back goes to the page the cart was opened on (Bunny World or Websites), with the cart open */
try{var r=document.referrer&&new URL(document.referrer);if(r&&r.origin===location.origin&&r.pathname!==location.pathname)document.getElementById('back').href=r.pathname+r.search+'#cart';}catch(e){}
var main=document.getElementById('co');
if(!ids.length){main.innerHTML='<div class="sp-empty"><h1>Your cart is empty</h1><p class="sp-muted">Pick a fix, a care plan or a kickoff first.</p><a class="sp-btn" href="/preview/services/websites/#buy">See what you can buy &rarr;</a></div>';return;}
var once=0,month=0,now=0;
var rows=ids.map(function(id){var p=P[id],q=Math.min(p.maxQty||1,c[id]),t=p.price*q;if(p.interval)month+=t;else once+=t;now+=S.payNow(id,q);
  return '<li><div><b>'+p.name+(q>1?' &times; '+q:'')+'</b><p class="sp-muted">'+(S.how(id).charAt(0).toUpperCase()+S.how(id).slice(1))+(p.from?' &middot; from '+money(p.price)+' each':'')+'</p></div><span>'+money(t)+(p.interval?'/mo':'')+'</span></li>';}).join('');
main.innerHTML='<div class="sp-co"><section aria-labelledby="h-sum"><p class="sp-k">Checkout &middot; demo</p><h1 id="h-sum">Your order</h1><ul class="sp-items">'+rows+'</ul>'+
  '<dl class="sp-sum">'+(once&&month?'<div><dt>Paid once</dt><dd>'+money(once)+'</dd></div>':'')+(month?'<div><dt>Care plan, monthly</dt><dd>'+money(month)+'/mo</dd></div>':'')+
  '<div class="t"><dt>Due today</dt><dd>'+money(now)+'</dd></div></dl></section>'+
  '<section class="sp-pay sp-glass" aria-labelledby="h-pay"><h2 id="h-pay">When you pay</h2><ul class="sp-when">'+ids.map(function(id){return '<li><b>'+P[id].name+'.</b> '+S.when(id,c[id])+'</li>';}).join('')+'</ul>'+
  (now?'<p class="sp-muted">On the real shop you pay the '+money(now)+' on Stripe&rsquo;s secure page: card, Apple Pay or Google Pay.</p>':'<p class="sp-muted">Nothing is due today, so there are no card details to fill in.</p>')+
  '<a class="sp-btn" href="'+S.thanks+'?demo=1">Place the demo order &rarr;</a><p class="sp-muted" style="text-align:center">It&rsquo;s a demo: nothing is charged and nobody is told.</p></section></div>';
})();
</script>
</body>
</html>
