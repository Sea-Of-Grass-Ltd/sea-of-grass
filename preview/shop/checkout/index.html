<!doctype html>
<html lang="en" data-theme="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkout (demo) · Sea of Grass</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0C11">
<link rel="icon" href="/preview/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/preview/assets/shop/page.css">
</head>
<body>
<div class="sp-wrap">
  <header class="sp-top">
    <a class="sp-home" href="/"><img src="/preview/assets/logo.svg" alt="" width="30" height="22"><span>Sea of Grass</span></a>
    <a class="sp-back" href="/preview/services/websites/#cart">&larr; Back to cart</a>
  </header>
  <div class="sp-demo" role="note"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.2v.3"/></svg>
    <p style="margin:0"><b>Demo checkout. No payment is taken.</b> This page stands in for Stripe&rsquo;s checkout until the real payment links are set up. It asks for no card details and nothing is charged.</p></div>
  <main id="co"></main>
</div>
<script src="/preview/assets/shop/checkout-links.js"></script>
<script>
(function(){
var S=window.SOG_SHOP,P=S.products,c={};
try{c=JSON.parse(localStorage.getItem('sog-cart')||'{}');}catch(e){}
var ids=Object.keys(c).filter(function(k){return P[k]&&c[k]>0;});
var money=function(n){return '$'+n.toLocaleString('en-US');};
var main=document.getElementById('co');
if(!ids.length){main.innerHTML='<div class="sp-empty"><h1>Your cart is empty</h1><p class="sp-muted">Pick a fix, a care plan or a kickoff first.</p><a class="sp-btn" href="/preview/services/websites/#buy">See what you can buy &rarr;</a></div>';return;}
var once=0,month=0;
var rows=ids.map(function(id){var p=P[id],q=Math.min(p.maxQty||1,c[id]),t=p.price*q;if(p.interval)month+=t;else once+=t;
  return '<li><div><b>'+p.name+(q>1?' &times; '+q:'')+'</b><p class="sp-muted">'+(p.interval?'Billed monthly':'Paid once')+(p.from?' &middot; from '+money(p.price)+' each':'')+'</p></div><span>'+money(t)+(p.interval?'/mo':'')+'</span></li>';}).join('');
main.innerHTML='<div class="sp-co"><section aria-labelledby="h-sum"><p class="sp-k">Checkout &middot; demo</p><h1 id="h-sum">Your order</h1><ul class="sp-items">'+rows+'</ul>'+
  '<dl class="sp-sum">'+(once&&month?'<div><dt>Paid once</dt><dd>'+money(once)+'</dd></div>':'')+(month?'<div><dt>Care plan, monthly</dt><dd>'+money(month)+'/mo</dd></div>':'')+
  '<div class="t"><dt>Due today</dt><dd>'+money(once+month)+'</dd></div></dl>'+(month?'<p class="sp-muted" style="margin-top:10px">Then '+money(month)+' a month. Cancel any month.</p>':'')+'</section>'+
  '<section class="sp-pay sp-glass" aria-labelledby="h-pay"><h2 id="h-pay">Payment</h2><p class="sp-muted">On the live site this step is Stripe&rsquo;s own secure page: card, Apple Pay or Google Pay. Here it is only a placeholder.</p>'+
  '<div class="sp-stub" aria-hidden="true"><div>Email (entered on Stripe)</div><div>Card details (entered on Stripe)</div></div>'+
  '<a class="sp-btn" href="'+S.thanks+'?demo=1">Finish demo order &rarr;</a><p class="sp-muted" style="text-align:center">Nothing is charged. You go straight to the thank-you page.</p></section></div>';
})();
</script>
</body>
</html>
