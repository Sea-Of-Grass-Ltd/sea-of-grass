  for(const [col,r] of [["pink",r_v],["yellow",r_v-3*g]]){const hc=Math.sqrt(r*r-(xL1-vx)**2);add("left",col,`M${P(xL1,vy-hc)} A${r},${r} 0 0 0 ${P(xL1,vy+hc)} Z`);}

  for(const [n,col,t] of fr){ys[n]=[y,y+t];y+=t;}

  rect("frieze","cream",xF1,Cb,xR1+27,ys["wave-band"][1]);

  for(let i=0;i<N+5;i++){const u=dq(i+1);c.push([c[i][0]+(r[i]-r[i+1])*u[0],c[i][1]+(r[i]-r[i+1])*u[1]]);}
  const Pj=[[c[0][0]+r[0],c[0][1]]];for(let j=1;j<N+6;j++){const u=dq(j);Pj.push([c[j-1][0]+r[j-1]*u[0],c[j-1][1]+r[j-1]*u[1]]);}
  let dv=`M${P(...Pj[0])}`;for(let i=0;i<N;i++)dv+=` A${r[i]},${r[i]} 0 0 1 ${P(...Pj[i+1])}`;
  dv+=` L${P(...Pj[N+4])}`;for(let i=N+3;i>3;i--)dv+=` A${r[i]},${r[i]} 0 0 0 ${P(...Pj[i])}`;dv+=" Z";
  add("left","pale",dv);
  const ex=(Pj[N][0]+Pj[N+4][0])/2, ey=(Pj[N][1]+Pj[N+4][1])/2, wend=Math.hypot(Pj[N][0]-Pj[N+4][0],Pj[N][1]-Pj[N+4][1]);
  circle("left","yellow",ex,ey,wend/S3);
  const lo=Math.max(...c.slice(0,N).map((cc,i)=>cc[1]+r[i]));
  // the menu: cap 27h, pitch 81h, centred in the field
  const cap=27,pitch=81,block=cap+3*pitch;
  menuAt={axis:(xL1+xF1)/2, top:(field_top+Ft)/2-block/2, x0:xL1, x1:xF1, pitch, cap};
  return {shapes:out, Wh:xR1+M+Ex*0, Hh:lo+Y0, menuAt, field:{x0:xL1,y0:field_top,x1:xF1,y1:Ft}, order:["frame","left","bull","right","corner","frieze"]};
}

const BASE=build(0,0), BASE_W=BASE.Wh, BASE_H=BASE.Hh, L0=81-45, CW=BASE_W-2*81+90;
const cv=document.getElementById('inside'), c=cv.getContext('2d');
const thick=document.getElementById('thick'), front=document.getElementById('front'), menuSvg=document.getElementById('menu');
let vw=0,vh=0,DPR=1,h=1,P=null,vbx=0,vby=0,F=null,frontSVG='',menuG='';

function sp(x,y){return[(x-vbx)*h,(y-vby)*h];}
function layout(){
  DPR=REC?1:Math.min(2,devicePixelRatio||1);
  vw=REC?REC.w:innerWidth; vh=REC?REC.h:(innerHeight);
  cv.width=Math.round(vw*DPR);cv.height=Math.round(vh*DPR);
  h=Math.min(vw/CW, vh/BASE_H);
  const Ex=Math.min(486,Math.max(0,vw/h-CW)), Ey=Math.min(360,Math.max(0,vh/h-BASE_H));
  P=build(Ex,Ey);
  vbx=L0-(vw/h-(CW+Ex))/2; vby=(P.Hh-vh/h)/2;
  const vb=`${vbx} ${vby} ${vw/h} ${vh/h}`;
  const fd=P.field;
  // the front: the panel, with the field cut out as the nook's opening
  let s=`<path fill="${C.ground}" fill-rule="evenodd" d="M${vbx-50},${vby-50} h${vw/h+100} v${vh/h+100} h${-(vw/h+100)} Z M${fd.x0},${fd.y0} V${fd.y1} H${fd.x1} V${fd.y0} Z"/>`;
  for(const L of P.order){s+=`<g>`;for(const q of P.shapes.filter(q=>q.layer===L))s+=`<path fill="${C[q.fill]}" stroke="${C.ink}" stroke-width="1" d="${q.d}"/>`;s+='</g>';}
  s+=`<path fill="none" stroke="${C.ink}" stroke-width="1" d="M${fd.x0},${fd.y0} H${fd.x1} V${fd.y1} H${fd.x0} Z"/>`;
  frontSVG=s;
  for(const el of [front,thick]){el.setAttribute('viewBox',vb);el.setAttribute('preserveAspectRatio','xMidYMid meet');}
  front.innerHTML=s;
  // the thickness: the same frame, solid and shaded, stepped back (offset each frame)
  thick.innerHTML=`<g id="tk">${P.shapes.map(q=>`<path fill="${C[q.fill]}" d="${q.d}"/>`).join('')}</g>`;
  const [fx0,fy0]=sp(fd.x0,fd.y0),[fx1,fy1]=sp(fd.x1,fd.y1); F={x:fx0,y:fy0,w:fx1-fx0,h:fy1-fy0};
  // the menu, as links, on its own layer
  const m=P.menuAt,b=BASE.menuAt,dx=m.axis-b.axis,dy=m.top-b.top;
  let mg='';let wi=0;
  for(const grp of MENU.split(/(?=<g id=")/).filter(x=>x.trim())){
    const id=(grp.match(/<g id="([^"]+)"/)||[])[1]||'',L=LINKS.find(l=>l[0]===id);
    if(L){const y0=(b.top+wi*b.pitch-20)*H0,x0=(b.x0+9)*H0,w=(b.x1-b.x0-18)*H0;
      mg+=`<a href="${L[2]}" aria-label="${L[1]}"><rect class="hit" fill="transparent" x="${x0}" y="${y0}" width="${w}" height="${67*H0}"/>${grp.replace('<g id="'+id+'"','<g class="word" id="'+id+'"')}</a>`;wi++;}
    else mg+=grp;
  }
  menuG={html:mg,dx,dy};
  menuSvg.setAttribute('viewBox',`0 0 ${vw} ${vh}`);
  menuSvg.innerHTML=`<defs><clipPath id="win"><rect x="${F.x}" y="${F.y}" width="${F.w}" height="${F.h}"/></clipPath></defs><g clip-path="url(#win)"><g id="mg">${mg}</g></g>`;
  plant();
}

// ---- inside the box -------------------------------------------------------------------------
// Each flat is drawn in the opening's own pixels, then placed at its depth z (0 = the front,
// 1 = the back wall) by one uniform scale about a vanishing point: circles stay circles.
const DEPTH=.74;                                      // the back wall is 74% of the opening
let px=0,py=0,tx=0,ty=0,scrollQ=0;
function layerRect(z){
  const cx=F.x+F.w/2, cy=F.y+F.h/2;
  const bx=cx-px*F.w*.09, by=cy-py*F.h*.07-scrollQ*F.h*.12;   // the back wall slides opposite the eye
  const s=1-(1-DEPTH)*z, x=lerp(cx,bx,z), y=lerp(cy,by,z);
  return{s,x,y,cx,cy};
}
const lerp=(a,b,t)=>a+(b-a)*t, cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
function into(z){const L=layerRect(z);c.setTransform(DPR*L.s,0,0,DPR*L.s,DPR*(L.x-L.cx*L.s),DPR*(L.y-L.cy*L.s));return L;}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// the grass flat: Windrow's blades, on springs, swept by the pointer
let blades=[];
function plant(){const r=rng(7);blades=[];const n=Math.round(Math.min(2400,F.w*F.h/180));
  for(let i=0;i<n;i++){const d=Math.pow(r(),.7);blades.push({x:F.x-F.w*.05+r()*F.w*1.1,y:F.y+F.h*(.7+d*.32),h:F.h*(.025+d*.06)*(.7+r()*.6),rest:(r()-.5)*.25,a:0,w:0,band:Math.min(4,Math.floor(d*5)),ph:r()*TAU});}
  blades.sort((a,b)=>a.y-b.y);}
let ptr=null,pprev=null;
function stepGrass(now){
  // the pointer, brought into the grass flat's own coordinates
  const L=layerRect(.32);let tip=null;
  if(ptr){const x=(ptr.x-L.x)/L.s+L.cx,y=(ptr.y-L.y)/L.s+L.cy;tip={x,y,vx:ptr.vx/L.s,vy:ptr.vy/L.s};}
  const rr=F.w*.16,r2=rr*rr;
  for(const b of blades){
    const breeze=Math.sin(now*.0009+b.x*.01+b.ph*.3)*.08+Math.sin(now*.0023+b.y*.02)*.03+.05;
    let f=(b.rest+breeze-b.a)*.045;
    if(tip){const mx=b.x+Math.sin(b.a)*b.h*.5,my=b.y-Math.cos(b.a)*b.h*.5,dx=mx-tip.x,dy=my-tip.y,d2=dx*dx+dy*dy;
      if(d2<r2){const q=1-Math.sqrt(d2)/rr,q2=q*q;f+=tip.vx*.0045*q2+Math.sign(dx||1)*.02*q2;}}
    b.w=(b.w+f)*.86;b.a=Math.max(-1.3,Math.min(1.3,b.a+b.w));
  }
}
function drawBlades(from,to,ink){
  c.lineCap='round';
  for(let band=from;band<=to;band++){const k=band/4;c.strokeStyle=ink(k);c.lineWidth=(.6+k*1.1)*h*.9;c.beginPath();
    for(const b of blades){if(b.band!==band)continue;const tx=b.x+Math.sin(b.a)*b.h,ty=b.y-Math.cos(b.a)*b.h;c.moveTo(b.x,b.y);c.quadraticCurveTo(b.x+Math.sin(b.a*.45)*b.h*.55,b.y-b.h*.6,tx,ty);}
    c.stroke();}
}
function capsule(x0,x1,y,r){c.beginPath();c.moveTo(x0,y-r);c.lineTo(x1,y-r);c.arc(x1,y,r,-Math.PI/2,Math.PI/2);c.lineTo(x0,y+r);c.arc(x0,y,r,Math.PI/2,Math.PI*1.5);c.closePath();}

function drawInside(now){
  const {x:X,y:Y,w:Wd,h:Hd}=F, hz=Y+Hd*.58, t=now/1000;
  c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,vw,vh);
  c.save();c.beginPath();c.rect(X,Y,Wd,Hd);c.clip();
  // the box: back wall then walls, as a frustum from the opening to the back
  const B=layerRect(1),bw=Wd*B.s,bh=Hd*B.s,bx=B.x-bw/2,by=B.y-bh/2;
  const quad=(pts,fill)=>{c.fillStyle=fill;c.beginPath();pts.forEach(([a,b],i)=>i?c.lineTo(a,b):c.moveTo(a,b));c.closePath();c.fill();};
  quad([[X,Y],[X+Wd,Y],[bx+bw,by],[bx,by]],'#fbf5e6');                    // the ceiling: the lit slot
  quad([[X,Y],[bx,by],[bx,by+bh],[X,Y+Hd]],'#e8dcc0');                    // left wall
  quad([[X+Wd,Y],[bx+bw,by],[bx+bw,by+bh],[X+Wd,Y+Hd]],'#e2d4b5');        // right wall
  quad([[X,Y+Hd],[bx,by+bh],[bx+bw,by+bh],[X+Wd,Y+Hd]],'#cfc29e');        // floor
  // 1 · the back wall: a big sky, low sun, flat cloud, the prairie running to the horizon
  into(1);
  let gr=c.createLinearGradient(0,Y,0,hz);gr.addColorStop(0,'#c9d3cf');gr.addColorStop(.55,'#efe3c8');gr.addColorStop(1,'#f0c9a2');
  c.fillStyle=gr;c.fillRect(X,Y,Wd,hz-Y);
  const sx=X+Wd*.3,sy=hz-Wd*.02;                                         // the sun, struck, with rings
  for(const [r,col] of [[Wd*.2,'rgba(233,191,155,.35)'],[Wd*.15,'rgba(233,191,155,.55)'],[Wd*.1,'#e6d17f']]){c.fillStyle=col;c.beginPath();c.arc(sx,sy,r,0,TAU);c.fill();}
  c.fillStyle='#eadba0';c.fillRect(X,hz,Wd,Y+Hd-hz);
  // 2 · clouds: long flat bands, drifting with the wind
  into(.88);
  c.fillStyle='rgba(247,239,217,.92)';c.strokeStyle=C.ink;c.lineWidth=h*.7;
  [[.12,.18,.5,.012],[.45,.27,.42,.009],[-.1,.36,.36,.007]].forEach(([x0,y0,len,th],i)=>{
    const dx=((t*(.012+i*.004)+x0+1)%1.6-.3)*Wd;capsule(X+dx,X+dx+len*Wd,Y+Hd*y0,Hd*th);c.fill();c.stroke();});
  // 3 · the horizon: a fence line running away, poles on a strict interval
  into(.74);
  c.fillStyle='#a3ad9c';c.fillRect(X-Wd*.2,hz-Hd*.004,Wd*1.4,Hd*.016);
  c.strokeStyle=C.ink;c.lineWidth=h*.8;c.beginPath();
  for(let i=0;i<14;i++){const px2=X-Wd*.1+i*Wd*.095,ph=Hd*.03;c.moveTo(px2,hz);c.lineTo(px2,hz-ph);}
  c.moveTo(X-Wd*.1,hz-Hd*.022);c.lineTo(X+Wd*1.2,hz-Hd*.022);c.stroke();
  // 4 · the mid flat: shortgrass ground and a ranch windmill, its wheel turning in the wind
  into(.55);
  c.fillStyle='#e6d17f';c.beginPath();c.moveTo(X-Wd*.2,Y+Hd*.64);c.lineTo(X+Wd*1.2,Y+Hd*.62);c.lineTo(X+Wd*1.2,Y+Hd*1.2);c.lineTo(X-Wd*.2,Y+Hd*1.2);c.closePath();c.fill();
  c.strokeStyle=C.ink;c.lineWidth=h*.8;c.stroke();
  const wx=X+Wd*.74,wb=Y+Hd*.63,wt=Y+Hd*.36,wr=Wd*.085;
  c.beginPath();c.moveTo(wx-Wd*.05,wb);c.lineTo(wx-Wd*.008,wt);c.moveTo(wx+Wd*.05,wb);c.lineTo(wx+Wd*.008,wt);
  for(let k=1;k<6;k++){const yy=lerp(wb,wt,k/6),hw=lerp(Wd*.05,Wd*.008,k/6);c.moveTo(wx-hw,yy);c.lineTo(wx+hw,yy);}
  c.stroke();
  const rot=t*1.6;c.save();c.translate(wx,wt);c.fillStyle='rgba(247,239,217,.95)';c.beginPath();c.arc(0,0,wr,0,TAU);c.fill();c.stroke();
  c.beginPath();c.arc(0,0,wr*.3,0,TAU);c.stroke();
  for(let k=0;k<18;k++){const a=rot+k*TAU/18;c.beginPath();c.moveTo(Math.cos(a)*wr*.3,Math.sin(a)*wr*.3);c.lineTo(Math.cos(a)*wr,Math.sin(a)*wr);c.stroke();}
  c.fillStyle=C.ink;c.beginPath();c.moveTo(0,0);c.lineTo(Wd*.13,-Hd*.008);c.lineTo(Wd*.13,Hd*.012);c.closePath();c.fill();
  c.restore();
  // 5 · the grass flat
  into(.32);
  c.fillStyle='#d9c27a';c.fillRect(X-Wd*.2,Y+Hd*.72,Wd*1.4,Hd*.5);
  drawBlades(0,4,k=>`rgba(43,38,32,${.25+k*.55})`);
  // light from the top opening: a soft fall of warm light, and shadow at the lip
  c.setTransform(DPR,0,0,DPR,0,0);
  gr=c.createLinearGradient(0,Y,0,Y+Hd*.6);gr.addColorStop(0,'rgba(255,248,226,.55)');gr.addColorStop(1,'rgba(255,248,226,0)');c.fillStyle=gr;c.fillRect(X,Y,Wd,Hd*.6);
  c.save();c.globalAlpha=.16;c.fillStyle='#fffaf0';
  for(let i=0;i<3;i++){const x0=X+Wd*(.15+i*.28)+px*Wd*.05;c.beginPath();c.moveTo(x0,Y);c.lineTo(x0+Wd*.1,Y);c.lineTo(x0+Wd*.22,Y+Hd*.7);c.lineTo(x0+Wd*.12,Y+Hd*.7);c.closePath();c.fill();}
  c.restore();
  const edge=(x0,y0,x1,y1,w)=>{const gg=c.createLinearGradient(x0,y0,x1,y1);gg.addColorStop(0,'rgba(43,38,32,.38)');gg.addColorStop(1,'rgba(43,38,32,0)');c.fillStyle=gg;return gg;};
  const sw=Math.max(8,F.w*.06);
  edge(X,0,X+sw,0);c.fillRect(X,Y,sw,Hd);edge(X+Wd,0,X+Wd-sw,0);c.fillRect(X+Wd-sw,Y,sw,Hd);
  edge(0,Y+Hd,0,Y+Hd-sw);c.fillRect(X,Y+Hd-sw,Wd,sw);edge(0,Y,0,Y+sw*.5);c.fillRect(X,Y,Wd,sw*.5);
  c.restore();
}
function placeMenu(){
  const L=layerRect(.16), s=L.s, b=BASE.menuAt;
  // master menu px -> h -> this page's field -> screen -> the menu flat's depth
  const a=h/H0, ox=(menuG.dx-vbx)*h, oy=(menuG.dy-vby)*h;
  const m=`translate(${L.x-L.cx*s} ${L.y-L.cy*s}) scale(${s}) translate(${ox} ${oy}) scale(${a})`;
  const g=menuSvg.querySelector('#mg');if(g)g.setAttribute('transform',m);
  return m;
}
function placeThick(){const t=thick.querySelector('#tk');if(t)t.setAttribute('transform',`translate(${px*-6+0} ${py*-6+4})`);}

// ---- input: pointer, tilt, scroll -----------------------------------------------------------
addEventListener('pointermove',e=>{const x=e.clientX,y=e.clientY;ptr={x,y,vx:pprev?x-pprev.x:0,vy:pprev?y-pprev.y:0};pprev={x,y};tx=cl((x/vw)*2-1,-1,1);ty=cl((y/vh)*2-1,-1,1);},{passive:true});
addEventListener('pointerleave',()=>{ptr=null;pprev=null;tx=0;ty=0;});
addEventListener('touchmove',e=>{const q=e.touches[0];if(!q)return;const x=q.clientX,y=q.clientY;ptr={x,y,vx:pprev?x-pprev.x:0,vy:pprev?y-pprev.y:0};pprev={x,y};},{passive:true});
addEventListener('touchend',()=>{pprev=null;});
try{addEventListener('deviceorientation',e=>{if(e.gamma==null)return;tx=cl(e.gamma/25,-1,1);ty=cl((e.beta-45)/25,-1,1);});}catch(e){}
function scrollP(){const max=Math.max(1,document.documentElement.scrollHeight-innerHeight);return cl(scrollY/max);}

function frame(now){
  px+=(tx-px)*.08;py+=(ty-py)*.08;scrollQ+=(scrollP()-scrollQ)*.12;
  stepGrass(now);if(ptr)ptr={...ptr,vx:ptr.vx*.6,vy:ptr.vy*.6};
  drawInside(now);placeMenu();placeThick();
  if(!REC)requestAnimationFrame(frame);
}
// ---- record mode: #rec<start>-<count>-<w>x<h> draws a 240-frame (8 s) orbit into images ----
const RM=/^#rec(\d+)-(\d+)-(\d+)x(\d+)$/.exec(location.hash);
const REC=RM?{s:+RM[1],n:+RM[2],w:+RM[3],h:+RM[4]}:null;
let raf=0;addEventListener('resize',()=>{if(REC)return;cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>layout());});
layout();
if(!REC)requestAnimationFrame(frame);
else{
  const toImg=(svgText,vb)=>new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="${vw}" height="${vh}">${svgText}</svg>`);});
  (async()=>{
    const vb=front.getAttribute('viewBox');
    const fImg=await toImg(frontSVG,vb), tImg=await toImg(`<g style="filter:brightness(.62)">${thick.innerHTML}</g>`,vb);
    const out=[];
    for(let f=0;f<REC.s+REC.n;f++){
      const T=f/240, now=f*1000/30;
      tx=Math.sin(T*TAU)*.9;ty=Math.sin(T*TAU*2)*.45;          // an orbit of the eye
      const ang=T*TAU*3, R=F.w*.25;ptr={x:F.x+F.w/2+Math.cos(ang)*R,y:F.y+F.h*.82+Math.sin(ang*2)*F.h*.04,vx:-Math.sin(ang)*R*TAU*3/240,vy:0};
      scrollQ=.5-.5*Math.cos(T*TAU);
      px+=(tx-px)*.25;py+=(ty-py)*.25;stepGrass(now);drawInside(now);const m=placeMenu();
      if(f<REC.s)continue;
      c.setTransform(1,0,0,1,0,0);
      c.drawImage(tImg,-px*6*h,(-py*6+4)*h);c.drawImage(fImg,0,0);
      const mi=await toImg(`<g transform="${m}">${menuG.html}</g>`,`0 0 ${vw} ${vh}`);
      c.save();c.beginPath();c.rect(F.x,F.y,F.w,F.h);c.clip();c.drawImage(mi,0,0);c.restore();
      out.push(cv.toDataURL('image/jpeg',.85));
    }
    const pre=document.createElement('pre');pre.id='out';pre.textContent=out.join('\n');document.body.appendChild(pre);
  })();
}
})();
</script>

</body></html>
